steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - --no-cache
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  # Offline release gate.  The image cannot be pushed or deployed unless the
  # persisted Today + Global + Korea corpus and authority tests pass.
  - name: gcr.io/cloud-builders/docker
    id: ProductRegressionGate
    waitFor:
      - Build
    args:
      - run
      - --rm
      - --network=none
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - python
      - scripts/run_product_regression_gate.py

  - name: gcr.io/cloud-builders/docker
    id: DelegatedAuthorityGate
    waitFor:
      - ProductRegressionGate
    args:
      - run
      - --rm
      - --network=none
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - python
      - -m
      - unittest
      - -v
      - tests.test_genie_root_auth
      - tests.test_today_vertex_transient_retry_20260910.VertexTransientRetryTests.test_call_gemini_does_not_log_provider_exception_text_or_traceback
      - tests.test_admin_beta_delegation
      - tests.test_admin_beta_edits
      - tests.test_delegated_internal_route
      - tests.test_delegated_grant_release_path
      - tests.test_keysuri_customer_delivery
      - tests.test_admin_routes.AdminRoutesTests.test_reissue_body_only_executes_keysuri_helper_only
      - tests.test_admin_routes.AdminRoutesTests.test_body_only_exhausted_pool_renders_safe_panel

  # Extend the already-built commit-tagged production image with pytest only.
  # The test layer is never pushed; tests run without network.
  - name: gcr.io/cloud-builders/docker
    id: BuildReviewRegressionImage
    waitFor:
      - DelegatedAuthorityGate
    args:
      - build
      - --no-cache
      - --build-arg
      - BASE_IMAGE=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -f
      - Dockerfile.regression
      - -t
      - genie-review-regression:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    id: DelegatedReviewRegressionGate
    waitFor:
      - BuildReviewRegressionImage
    args:
      - run
      - --rm
      - --network=none
      - genie-review-regression:$COMMIT_SHA
      - python
      - -m
      - pytest
      - -q
      - tests/test_delegated_authenticated_gate.py
      - tests/test_delegated_review_shadow.py
      - tests/test_admin_routes.py

  - name: gcr.io/cloud-builders/docker
    id: Push
    waitFor:
      - DelegatedReviewRegressionGate
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: ResolveDigest
    waitFor:
      - Push
    entrypoint: bash
    env:
      - IMAGE_TAG=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    args:
      - -ceu
      - |
        gcloud artifacts docker images describe "$$IMAGE_TAG" \
          --project=$_AR_PROJECT_ID \
          --format='value(image_summary.fully_qualified_digest)' \
          > /workspace/immutable-image.txt
        test -s /workspace/immutable-image.txt

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: DeployExact
    waitFor:
      - ResolveDigest
    entrypoint: bash
    env:
      - REVISION_SUFFIX=gcb-$BUILD_ID
      - SERVICE_NAME=$_SERVICE_NAME
    args:
      - -ceu
      - |
        read -r immutable_image < /workspace/immutable-image.txt
        revision_name="$$SERVICE_NAME-$$REVISION_SUFFIX"
        gcloud run services update "$$SERVICE_NAME" \
          --platform=managed \
          --image="$$immutable_image" \
          --revision-suffix="$$REVISION_SUFFIX" \
          --no-traffic \
          --update-env-vars=COMMIT_SHA=$COMMIT_SHA \
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID \
          --region=$_DEPLOY_REGION \
          --project=$_AR_PROJECT_ID \
          --quiet
        gcloud run revisions describe "$$revision_name" \
          --region=$_DEPLOY_REGION \
          --project=$_AR_PROJECT_ID \
          --format='value(status.imageDigest)' \
          > /workspace/deployed-image.txt
        read -r deployed_image < /workspace/deployed-image.txt
        test "$$deployed_image" = "$$immutable_image"
        printf '%s\n' "$$revision_name" > /workspace/deployed-revision.txt

  # Traffic may be pinned to an older revision. Promote only the exact revision
  # created above, after its immutable digest has been verified.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: PromoteExact
    waitFor:
      - DeployExact
    entrypoint: bash
    env:
      - SERVICE_NAME=$_SERVICE_NAME
    args:
      - -ceu
      - |
        read -r revision_name < /workspace/deployed-revision.txt
        test -n "$$revision_name"
        gcloud run services update-traffic "$$SERVICE_NAME" \
          --to-revisions="$$revision_name=100" \
          --region=$_DEPLOY_REGION \
          --project=$_AR_PROJECT_ID \
          --quiet

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

substitutions:
  _AR_HOSTNAME: asia-northeast3-docker.pkg.dev
  _AR_PROJECT_ID: gen-lang-client-0667098249
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: asia-northeast3
  _PLATFORM: managed
  _SERVICE_NAME: genie-blog-run
  _TRIGGER_ID: a4352f88-77f4-4724-b563-800d3ec7a6b8

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - genie-blog-run
