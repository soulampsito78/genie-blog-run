      .green { fill:#e9f6ed; stroke:#76ab8a; }
      .amber { fill:#fff3de; stroke:#c99c59; }
      .line { fill:none; stroke:#678499; stroke-width:2.5; stroke-linejoin:round; }
      .back { stroke-dasharray:7 5; }
      .divider { stroke:#cad9e0; stroke-width:2; }
    </style>
  </defs>
