<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1510" viewBox="0 0 1440 1510" role="img" aria-labelledby="title description">
  <title id="title">GENIE·KeeSuri 운영 워크플로우</title>
  <desc id="description">실제 수신 메일과 후보의 자동검수 결과를 대조한다. 통과와 가벼운 표현 과장은 발송 조건으로, 주의 이상은 영향 항목 검수로 연결한다. 검수 불가는 실제 프롬프트 로직을 포함한 원인 파악, 장애 복구, 기존 후보 재판정 순으로 처리한다. 새 후보가 꼭 필요한 경우에만 재발행한다. 같은 실행이 정시 단일 발송과 SMTP 및 원장 대조를 맡는다.</desc>
  <metadata>GENIE-KEYSURI-OPS-WORKFLOW v1.7 · 2026-11-10 KST · ../GENIE_KEYSURI_OPERATING_WORKFLOW.md</metadata>
