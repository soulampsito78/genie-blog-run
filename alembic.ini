# Alembic configuration - SINGLE migration authority for this repository.
#
# Scope: the customer backend database (customer/persistence). The operational
# GENIE / KeeSuri briefing runtime has no relational schema; it persists to
# GCS artifacts and JSON stores, so there is no second migration environment
# and none may be created.
#
# The database URL is NOT stored here. It is read from the CUSTOMER_DATABASE_URL
# environment variable by customer/migrations/env.py, which refuses to run when
# the variable is unset. This keeps production connection details out of the
# repository entirely.
#
# Usage:
#   CUSTOMER_DATABASE_URL=postgresql+psycopg://... alembic upgrade head
#   CUSTOMER_DATABASE_URL=postgresql+psycopg://... alembic downgrade base

[alembic]
script_location = customer/migrations
prepend_sys_path = .
path_separator = os

# Timestamped, descriptive revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
